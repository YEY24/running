name: Public publishing paused for privacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Public publishing is paused
        run: |
          echo "No running data is fetched, uploaded, or deployed by this workflow."
          echo "Unpublish the existing site in repository Settings > Pages."
          echo "Private hosting must be configured before synchronization resumes."
