name: Publish corrected map with completed running data
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-deployment.yml
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13151110598'
          run-id: '41460905410'
          github-token: ${{ github.token }}
          path: recovered
      - name: Restore already synchronized public activity data
        run: |
          mkdir -p previous-site
          tar -xf recovered/github-pages/artifact.tar -C previous-site
          cp previous-site/assets/activities-GyUGRFB1.json src/static/activities.json
          python3 -c 'import json; from pathlib import Path; Path("src/static/sync-status.json").write_text(json.dumps({"synced_at":"2026-11-02T14:44:04+00:00","runs":619,"routes":True,"skipped_stubs":0}))'
      - uses: pnpm/action-setup@v4
        with:
          version: '8.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: PATH_PREFIX=/running pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          name: running-map-recovery
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: running-map-recovery
